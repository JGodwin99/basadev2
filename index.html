<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BASA Development Initiatives - Transforming Lives</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script async src="https://widgets.givebutter.com/latest.umd.cjs?acct=jLsA8cjV1CXEc9G5&p=other"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" rel="stylesheet">

    <style>
        /* ========== BOOTSTRAP CORE (essential) ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 400; line-height: 1.5; color: #000; background-color: #fff; -webkit-text-size-adjust: 100%; }
        h1, .h1, h2, .h2, h3, .h3 { margin-top: 0; margin-bottom: .5rem; font-family: 'Poppins', sans-serif; font-weight: 600; line-height: 1.2; color: #222; }
        p { margin-top: 0; margin-bottom: 1rem; }
        a { color: #b40000; text-decoration: none; }
        a:hover { color: #c69350; }
        img, svg { vertical-align: middle; max-width: 100%; height: auto; }
        .container, .container-fluid { width: 100%; padding-right: 0.75rem; padding-left: 0.75rem; margin-right: auto; margin-left: auto; }
        .row { --bs-gutter-x: 1.5rem; display: flex; flex-wrap: wrap; margin-right: calc(var(--bs-gutter-x) / -2); margin-left: calc(var(--bs-gutter-x) / -2); }
        .row > * { flex-shrink: 0; width: 100%; max-width: 100%; padding-right: calc(var(--bs-gutter-x) / 2); padding-left: calc(var(--bs-gutter-x) / 2); }
        .col-md-8 { flex: 0 0 auto; width: 66.66666667%; }
        .col-md-4 { flex: 0 0 auto; width: 33.33333333%; }
        @media (max-width: 768px) { .col-md-8, .col-md-4 { width: 100%; } }
        .text-center { text-align: center !important; }
        .text-light { color: #fff !important; }
        .text-primary { color: #b40000 !important; }
        .text-uppercase { text-transform: uppercase !important; }
        .bg-white { background-color: #fff !important; }
        .position-fixed { position: fixed !important; }
        .top-50 { top: 50% !important; }
        .start-50 { left: 50% !important; }
        .translate-middle { transform: translate(-50%, -50%) !important; }
        .w-100 { width: 100% !important; }
        .vh-100 { height: 100vh !important; }
        .mx-auto { margin-right: auto !important; margin-left: auto !important; }
        .btn { display: inline-block; font-weight: 400; line-height: 1.5; text-align: center; vertical-align: middle; cursor: pointer; padding: .375rem .75rem; border-radius: 0; border: 1px solid transparent; }
        .btn-primary { color: #fff; background-color: #b40000; border-color: #b40000; }
        .btn-primary:hover { color: #000; background-color: #f9c37b; border-color: #f9bf74; }
        .btn-square, .btn-md-square { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        .img-fluid { max-width: 100%; height: auto; }
        .d-flex { display: flex !important; }
        .align-items-center { align-items: center !important; }
        .justify-content-center { justify-content: center !important; }
        .justify-content-end { justify-content: flex-end !important; }
        .flex-wrap { flex-wrap: wrap !important; }
        .py-5 { padding-top: 3rem !important; padding-bottom: 3rem !important; }
        .px-5 { padding-left: 3rem !important; padding-right: 3rem !important; }
        .py-3 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
        .mb-4 { margin-bottom: 1.5rem !important; }
        .mb-3 { margin-bottom: 1rem !important; }
        .me-2 { margin-right: 0.5rem !important; }
        .me-4 { margin-right: 1.5rem !important; }
        .mt-5 { margin-top: 3rem !important; }
        .mt-4 { margin-top: 1.5rem !important; }
        .spinner-grow { display: inline-block; width: 2rem; height: 2rem; vertical-align: text-bottom; background-color: currentColor; border-radius: 50%; opacity: 0; animation: spinner-grow .75s linear infinite; }
        @keyframes spinner-grow { 0% { transform: scale(0); } 50% { opacity: 1; transform: none; } }

        /* ========== NAVBAR & TOPBAR STYLES ========== */
        :root {
            --brand-red: #990033;
            --brand-green: #005e4d;
            --sidebar-tan: #e9e6d1;
            --text-dark: #333;
            --white: #ffffff;
            --transition: all 0.3s ease;
            --navy: #1a1a2e;
            --brand-teal: #22c4a9;
            --bg-light: #fcfbf8;
        }

        .topbar { background-color: var(--brand-red); padding: 12px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; color: var(--white); gap: 15px; }
        .topbar-info { display: flex; flex-wrap: wrap; gap: 25px; font-size: 14px; }
        .topbar-info a { color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: opacity 0.3s; }
        .topbar-info a:hover { opacity: 0.85; }
        .topbar-socials { display: flex; flex-wrap: wrap; gap: 12px; }
        .social-btn { width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; border-radius: 50%; font-size: 14px; transition: all 0.3s; }
        .social-btn:hover { background: white; color: var(--brand-red); border-color: white; transform: translateY(-2px); }

        .navbar { background: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; min-height: 80px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.08); flex-wrap: wrap; }
        .logo img { height: 65px; display: block; max-width: 100%; }
        .mobile-menu-btn { display: none; background: transparent; border: none; padding: 10px 12px; cursor: pointer; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; color: var(--brand-red); transition: all 0.3s; font-family: 'Poppins', sans-serif; }
        .mobile-menu-btn i { font-size: 20px; }
        .mobile-menu-btn:hover { opacity: 0.7; }
        .nav-links { display: flex; list-style: none; gap: 28px; margin: 0; padding: 0; }
        .has-mega { position: static; }
        .nav-link { text-decoration: none; color: var(--text-dark); font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; padding: 10px 0; transition: var(--transition); white-space: nowrap; }
